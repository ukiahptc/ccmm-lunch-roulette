<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCMM 디저트 룰렛</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<meta name="description" content="여의도 CCMM빌딩 주변(여의도공원 서측 ~ 국회의사당역) 카페·디저트 룰렛 + KMAC 별점">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app.css">
<style>
/* 디저트 룰렛 테마: 라떼 브라운 곰돌이 카페 마을 */
:root{
  --bg:#f3e6d3; --surface:#fffaf2; --ink:#4a2f1e; --muted:#9a7b63; --line:#e3c8a8;
  --accent:#b8804f; --accent-dk:#8a5a33; --accent-ink:#fff; --chip:#f4e4cf; --chip-on:#b8804f; --chip-on-ink:#fff;
  --shadow:0 10px 28px rgba(138,90,51,.16);
  --w1:#f6e3c9;--w2:#e6c8a5;--w3:#d4b08a;--w4:#fbf1e2;--w5:#eed6ba;--w6:#c9a27b;--w7:#f9ebd8;--w8:#dfc3a3;
}
body{background:
    radial-gradient(circle at 12% 8%, #fbefdd 0, transparent 34%),
    radial-gradient(circle at 88% 18%, #e9d3b8 0, transparent 32%),
    radial-gradient(circle at 55% 95%, #f7e7d2 0, transparent 36%),
    var(--bg);
  background-attachment:fixed}
.spin{background:linear-gradient(180deg,#c99566,#a86f42);box-shadow:0 6px 0 #6f4526, var(--shadow)}
.spin:active{box-shadow:0 2px 0 #6f4526}
.chip.on{box-shadow:0 3px 0 #6f4526}
.result.hit{background:linear-gradient(180deg,#fff,#f7e9d8)}
.result{background:#fbf5ec}
.note{background:#f8eddd}
th{background:#f8eddd}
.summary{background:#f8eddd}
.cheer .bubble{background:#fff}
.badge.na{background:#fff1c9;color:#7a5a00}
.kmac .st{color:#d98c2b}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bear" viewBox="0 0 100 100">
      <circle cx="26" cy="30" r="12" fill="#b8804f" stroke="#8a5a33" stroke-width="2.5"/><circle cx="74" cy="30" r="12" fill="#b8804f" stroke="#8a5a33" stroke-width="2.5"/>
      <circle cx="26" cy="30" r="6" fill="#e6c8a5"/><circle cx="74" cy="30" r="6" fill="#e6c8a5"/>
      <circle cx="50" cy="58" r="33" fill="#b8804f" stroke="#8a5a33" stroke-width="2.5"/>
      <ellipse cx="50" cy="68" rx="14" ry="10" fill="#f6e3c9"/>
      <circle cx="38" cy="54" r="3.2" fill="#3b2314"/><circle cx="62" cy="54" r="3.2" fill="#3b2314"/>
      <ellipse cx="50" cy="64" rx="4" ry="3" fill="#3b2314"/><path d="M45 71q5 4 10 0" stroke="#3b2314" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="64" r="5" fill="#f2b6a0" opacity=".85"/><circle cx="71" cy="64" r="5" fill="#f2b6a0" opacity=".85"/>
    </symbol>
    <symbol id="bearcream" viewBox="0 0 100 100">
      <circle cx="26" cy="30" r="12" fill="#f3e0c6" stroke="#c9a27b" stroke-width="2.5"/><circle cx="74" cy="30" r="12" fill="#f3e0c6" stroke="#c9a27b" stroke-width="2.5"/>
      <circle cx="26" cy="30" r="6" fill="#f8c9b0"/><circle cx="74" cy="30" r="6" fill="#f8c9b0"/>
      <circle cx="50" cy="58" r="33" fill="#f3e0c6" stroke="#c9a27b" stroke-width="2.5"/>
      <ellipse cx="50" cy="68" rx="14" ry="10" fill="#fff8ee"/>
      <circle cx="38" cy="54" r="3.2" fill="#3b2314"/><circle cx="62" cy="54" r="3.2" fill="#3b2314"/>
      <ellipse cx="50" cy="64" rx="4" ry="3" fill="#6f4526"/><path d="M45 71q5 4 10 0" stroke="#3b2314" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="64" r="5" fill="#f8c9b0" opacity=".9"/><circle cx="71" cy="64" r="5" fill="#f8c9b0" opacity=".9"/>
    </symbol>
    <symbol id="bearmug" viewBox="0 0 100 100">
      <circle cx="30" cy="26" r="10" fill="#b8804f" stroke="#8a5a33" stroke-width="2.5"/><circle cx="70" cy="26" r="10" fill="#b8804f" stroke="#8a5a33" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="28" fill="#b8804f" stroke="#8a5a33" stroke-width="2.5"/>
      <ellipse cx="50" cy="58" rx="12" ry="8" fill="#f6e3c9"/>
      <circle cx="40" cy="46" r="2.8" fill="#3b2314"/><circle cx="60" cy="46" r="2.8" fill="#3b2314"/>
      <ellipse cx="50" cy="55" rx="3.5" ry="2.5" fill="#3b2314"/>
      <rect x="56" y="62" width="26" height="24" rx="5" fill="#fff" stroke="#8a5a33" stroke-width="2.5"/>
      <path d="M82 68h6a5 5 0 0 1 0 12h-6" fill="none" stroke="#8a5a33" stroke-width="2.5"/>
      <rect x="59" y="66" width="20" height="6" rx="2" fill="#c9a27b"/>
      <path d="M64 58q2-5 0-9M70 58q2-5 0-9" stroke="#c9a27b" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="house" viewBox="0 0 100 100">
      <path d="M12 48 L50 16 L88 48Z" fill="#c9a27b" stroke="#8a5a33" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="48" width="60" height="42" rx="4" fill="#fff8ee" stroke="#8a5a33" stroke-width="2.5"/>
      <rect x="42" y="62" width="16" height="28" rx="6" fill="#8a5a33"/><circle cx="54" cy="77" r="1.8" fill="#fff"/>
      <rect x="26" y="58" width="11" height="11" rx="2" fill="#fbe7c6" stroke="#8a5a33" stroke-width="2"/><rect x="63" y="58" width="11" height="11" rx="2" fill="#fbe7c6" stroke="#8a5a33" stroke-width="2"/>
      <rect x="62" y="22" width="9" height="14" rx="2" fill="#fff8ee" stroke="#8a5a33" stroke-width="2"/>
      <rect x="30" y="38" width="40" height="8" rx="3" fill="#8a5a33"/>
    </symbol>
    <symbol id="tree" viewBox="0 0 100 100">
      <rect x="45" y="60" width="10" height="30" rx="3" fill="#8a5a33"/>
      <circle cx="50" cy="44" r="24" fill="#b7c9a0" stroke="#7f9868" stroke-width="2.5"/><circle cx="34" cy="54" r="15" fill="#c9d8b3" stroke="#7f9868" stroke-width="2.5"/><circle cx="66" cy="54" r="15" fill="#c9d8b3" stroke="#7f9868" stroke-width="2.5"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 100 60">
      <path d="M22 50h56a14 14 0 0 0 0-28a20 20 0 0 0-38-6a16 16 0 0 0-18 34z" fill="#fff8ee" stroke="#e3c8a8" stroke-width="2.5"/>
    </symbol>
    <symbol id="mug" viewBox="0 0 100 100">
      <rect x="18" y="34" width="52" height="46" rx="8" fill="#fff8ee" stroke="#8a5a33" stroke-width="3"/>
      <path d="M70 44h8a10 10 0 0 1 0 22h-8" fill="none" stroke="#8a5a33" stroke-width="3"/>
      <rect x="22" y="40" width="44" height="10" rx="3" fill="#b8804f"/>
      <path d="M34 28q3-7 0-13M46 28q3-7 0-13M58 28q3-7 0-13" stroke="#c9a27b" stroke-width="3" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="cookie" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="#d9a86c" stroke="#8a5a33" stroke-width="3"/>
      <circle cx="38" cy="40" r="5" fill="#5a3a24"/><circle cx="60" cy="36" r="4" fill="#5a3a24"/><circle cx="64" cy="58" r="5" fill="#5a3a24"/><circle cx="44" cy="62" r="4" fill="#5a3a24"/><circle cx="52" cy="48" r="3" fill="#5a3a24"/>
    </symbol>
    <symbol id="honey" viewBox="0 0 100 100">
      <rect x="30" y="18" width="40" height="14" rx="4" fill="#8a5a33"/>
      <path d="M26 34h48v40a12 12 0 0 1-12 12H38a12 12 0 0 1-12-12z" fill="#f2c14e" stroke="#8a5a33" stroke-width="3"/>
      <path d="M32 46q9 4 18 0t18 0" stroke="#fff3c4" stroke-width="4" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
<header>
  <div class="brand">
    <svg class="mascot" aria-hidden="true"><use href="#bearmug"/></svg>
    <h1>CCMM 디저트 룰렛 <small>여의도공원 서측 · 국회의사당역까지 · 카페·디저트 · KMAC 별점</small></h1>
  </div>
  <div class="nav"><a href="../">🍚 점심 룰렛</a><div class="stats" id="stats"></div></div>
</header>
<svg class="village" viewBox="0 0 1000 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <use href="#cloud" x="60" y="4" width="90" height="54"/><use href="#cloud" x="700" y="0" width="110" height="66"/><use href="#cloud" x="880" y="18" width="70" height="42"/>
  <ellipse cx="180" cy="150" rx="320" ry="70" fill="#eedcc4"/><ellipse cx="820" cy="150" rx="340" ry="75" fill="#e9d4b8"/><ellipse cx="500" cy="165" rx="300" ry="70" fill="#f5e8d6"/>
  <use href="#tree" x="20" y="40" width="70" height="70"/><use href="#house" x="110" y="30" width="80" height="80"/><use href="#tree" x="200" y="48" width="60" height="60"/>
  <use href="#bear" x="285" y="60" width="50" height="50"/><use href="#cookie" x="336" y="80" width="22" height="22"/>
  <use href="#house" x="380" y="24" width="90" height="90"/><use href="#tree" x="470" y="44" width="66" height="66"/>
  <use href="#bearmug" x="560" y="60" width="52" height="52"/><use href="#bearcream" x="615" y="58" width="52" height="52"/><use href="#honey" x="672" y="78" width="24" height="24"/>
  <use href="#tree" x="700" y="40" width="72" height="72"/><use href="#house" x="790" y="36" width="74" height="74"/><use href="#mug" x="868" y="80" width="26" height="26"/><use href="#tree" x="900" y="50" width="58" height="58"/>
</svg>

<div class="grid">
  <section class="card">
    <svg class="peek tr" aria-hidden="true"><use href="#bear"/></svg>
    <h2>룰렛 <span class="sub" id="poolCount"></span></h2>
    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="760" height="760" aria-label="점심 룰렛"></canvas>
      <div class="hub"><span>GO!</span></div>
    </div>
    <button class="spin" id="spin">🧸 룰렛 돌리기!</button>
    <div class="history" id="history"></div>
  </section>

  <section class="card">
    <svg class="peek tr" aria-hidden="true"><use href="#bearcream"/></svg>
    <h2>필터 <span class="sub">룰렛에 올릴 후보를 고릅니다</span></h2>

    <div class="fgroup">
      <div class="lbl"><span>음식 분류</span><span><button data-cat="all">전체</button><button data-cat="none">전체 해제</button></span></div>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="fgroup">
      <div class="lbl"><span>구역</span><span><button data-zone="all">전체</button><button data-zone="scope">범위 안만</button><button data-zone="none">전체 해제</button></span></div>
      <div class="zones" id="zoneRow"></div>
    </div>

    <div class="fgroup">
      <div class="lbl"><span>KMAC 평가 조건</span></div>
      <div class="row" style="margin-top:0">
        <label>평균 별점
          <select id="minKmac">
            <option value="0">상관없음</option>
            <option value="3">3.0 이상</option>
            <option value="3.5">3.5 이상</option>
            <option value="4">4.0 이상</option>
            <option value="4.5">4.5 이상</option>
          </select>
        </label>
        <label><input type="checkbox" id="includeUnrated" checked> 아직 평가 없는 곳도 포함</label>
        <label><input type="checkbox" id="revisitOnly"> 재방문 의사 절반 이상만</label>
      </div>
    </div>

    <div class="fgroup">
      <div class="lbl"><span>기타</span></div>
      <div class="row" style="margin-top:0">
        <label><input type="checkbox" id="skipRecent" checked> 최근 5회 당첨 제외</label>
        <label><input type="checkbox" id="skipExcluded" checked> 목록에서 체크 해제한 곳 제외</label>
      </div>
    </div>

    <div class="summary"><span id="filterText"></span><span><span class="cnt" id="poolCnt">0</span>곳</span></div>
  </section>
</div>

<section class="card full">
  <h2>후보지 목록 <span class="sub" id="sync"></span></h2>
  <div class="toolbar">
    <input type="search" id="q" placeholder="상호·메뉴·건물 검색">
    <select id="sortBy">
      <option value="zone">구역순</option>
      <option value="kmac">KMAC 별점순</option>
      <option value="name">이름순</option>
      <option value="cat">분류순</option>
    </select>
    <button class="btn ghost" id="refreshBtn">시트 새로고침</button>
    <button class="btn ghost" id="exportBtn">평가 내보내기</button>
    <button class="btn ghost" id="importBtn">평가 가져오기</button>
    <input type="file" id="importFile" accept="application/json" class="sr">
    <button class="btn ghost danger" id="resetBtn">내 기록 초기화</button>
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr><th>포함</th><th>상호</th><th>분류·대표메뉴</th><th>위치</th><th>KMAC 별점</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<footer id="foot"></footer>
</div>

<!-- 결과 팝업 -->
<div class="modal" id="resultModal" role="dialog" aria-modal="true">
  <div class="dialog">
    <button class="x" data-close>×</button>
    <div class="result-body" id="resultBody"></div>
  </div>
</div>
<!-- 평가 팝업 -->
<div class="modal" id="rateModal" role="dialog" aria-modal="true">
  <div class="dialog">
    <button class="x" data-close>×</button>
    <h3 id="rateTitle">KMAC 별점</h3>
    <div class="field"><label>닉네임 (평가 구분용)</label><input type="text" id="who" maxlength="20" placeholder="예: 준원"></div>
    <div class="rate-row"><span class="k">맛</span><div class="stars" data-key="taste"></div><span class="v" data-v="taste">0</span></div>
    <div class="rate-row"><span class="k">청결</span><div class="stars" data-key="clean"></div><span class="v" data-v="clean">0</span></div>
    <div class="rate-row"><span class="k">친절도</span><div class="stars" data-key="kind"></div><span class="v" data-v="kind">0</span></div>
    <div class="rate-row"><span class="k">가격</span><div class="stars" data-key="price"></div><span class="v" data-v="price">0</span></div>
    <div class="field"><label>재방문 의사</label>
      <div class="seg" id="revisitSeg"><button data-rv="y">Y 또 올래요</button><button data-rv="n">N 한 번이면 충분</button></div>
    </div>
    <div class="field"><label>비고</label><textarea id="note" maxlength="300" placeholder="추천 메뉴, 웨이팅, 가격 등"></textarea></div>
    <div class="actions"><button class="btn primary" id="saveRate">저장</button><button class="btn ghost" data-close>취소</button></div>
    <div class="reviews" id="reviewList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="../config.js"></script>
<script src="data.js"></script>
<script>window.APP={ key:'cafe', data:window.RESTAURANTS, meta:window.META, cheerers:['bear','bearcream','bearmug'], lines:['달달한 거 먹으러 가자!','커피 한 잔 어때?','오늘의 디저트!','여기로 정했다~','당 충전 하러 가자!'] };</script>
<script src="../app.js"></script>
</body>
</html>
