<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCMM 점심 룰렛</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<meta name="description" content="여의도 CCMM빌딩 주변(여의도공원 서측 ~ 국회의사당역) 점심 맛집 룰렛 + KMAC 별점">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* 점심 룰렛 테마: 파스텔 핑크 동물 마을 */
:root{
  --bg:#fff6f9; --surface:#ffffff; --ink:#5a3648; --muted:#a97a90; --line:#f7cfe0;
  --accent:#f27fa9; --accent-dk:#d9538a; --accent-ink:#fff; --chip:#ffe6ef; --chip-on:#f27fa9; --chip-on-ink:#fff;
  --shadow:0 10px 28px rgba(242,127,169,.16);
  --w1:#ffd6e5;--w2:#ffe7c7;--w3:#d9f3e6;--w4:#e9dcff;--w5:#fff4c2;--w6:#d6ecff;--w7:#ffe1ec;--w8:#fcd9ff;
}
body{background:
    radial-gradient(circle at 15% 10%, #ffe4ee 0, transparent 34%),
    radial-gradient(circle at 85% 20%, #fff0e6 0, transparent 30%),
    radial-gradient(circle at 60% 90%, #ffe9f2 0, transparent 35%),
    var(--bg);
  background-attachment:fixed}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bunny" viewBox="0 0 100 100">
      <ellipse cx="37" cy="24" rx="9" ry="21" fill="#fff" stroke="#e8a6c0" stroke-width="2.5"/><ellipse cx="63" cy="24" rx="9" ry="21" fill="#fff" stroke="#e8a6c0" stroke-width="2.5"/>
      <ellipse cx="37" cy="26" rx="4.5" ry="14" fill="#ffc4d9"/><ellipse cx="63" cy="26" rx="4.5" ry="14" fill="#ffc4d9"/>
      <circle cx="50" cy="62" r="31" fill="#fff" stroke="#e8a6c0" stroke-width="2.5"/>
      <circle cx="39" cy="59" r="3.2" fill="#5a3648"/><circle cx="61" cy="59" r="3.2" fill="#5a3648"/>
      <circle cx="31" cy="69" r="5.5" fill="#ffc4d9"/><circle cx="69" cy="69" r="5.5" fill="#ffc4d9"/>
      <ellipse cx="50" cy="66" rx="2.6" ry="2" fill="#f27fa9"/><path d="M46 70q4 4 8 0" stroke="#5a3648" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="bear" viewBox="0 0 100 100">
      <circle cx="26" cy="30" r="12" fill="#f6c9a8" stroke="#d9a07c" stroke-width="2.5"/><circle cx="74" cy="30" r="12" fill="#f6c9a8" stroke="#d9a07c" stroke-width="2.5"/>
      <circle cx="26" cy="30" r="6" fill="#ffd9e6"/><circle cx="74" cy="30" r="6" fill="#ffd9e6"/>
      <circle cx="50" cy="58" r="33" fill="#f6c9a8" stroke="#d9a07c" stroke-width="2.5"/>
      <ellipse cx="50" cy="68" rx="14" ry="10" fill="#fff3e8"/>
      <circle cx="38" cy="54" r="3.2" fill="#5a3648"/><circle cx="62" cy="54" r="3.2" fill="#5a3648"/>
      <ellipse cx="50" cy="64" rx="4" ry="3" fill="#5a3648"/><path d="M45 71q5 4 10 0" stroke="#5a3648" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="29" cy="64" r="5" fill="#ffc4d9" opacity=".9"/><circle cx="71" cy="64" r="5" fill="#ffc4d9" opacity=".9"/>
    </symbol>
    <symbol id="cat" viewBox="0 0 100 100">
      <path d="M22 44 L18 12 L46 30Z" fill="#fff" stroke="#e8a6c0" stroke-width="2.5" stroke-linejoin="round"/><path d="M78 44 L82 12 L54 30Z" fill="#fff" stroke="#e8a6c0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M26 38 L24 20 L40 31Z" fill="#ffc4d9"/><path d="M74 38 L76 20 L60 31Z" fill="#ffc4d9"/>
      <ellipse cx="50" cy="60" rx="34" ry="30" fill="#fff" stroke="#e8a6c0" stroke-width="2.5"/>
      <circle cx="38" cy="56" r="3.2" fill="#5a3648"/><circle cx="62" cy="56" r="3.2" fill="#5a3648"/>
      <path d="M47 65 l3 3 l3 -3z" fill="#f27fa9"/><path d="M44 71q6 5 12 0" stroke="#5a3648" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M12 60h18M12 68h18M70 60h18M70 68h18" stroke="#e8a6c0" stroke-width="2" stroke-linecap="round"/>
      <circle cx="30" cy="66" r="5" fill="#ffc4d9" opacity=".9"/><circle cx="70" cy="66" r="5" fill="#ffc4d9" opacity=".9"/>
    </symbol>
    <symbol id="house" viewBox="0 0 100 100">
      <path d="M12 48 L50 16 L88 48Z" fill="#f9a8c9" stroke="#e8a6c0" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="48" width="60" height="42" rx="4" fill="#fff" stroke="#e8a6c0" stroke-width="2.5"/>
      <rect x="42" y="62" width="16" height="28" rx="6" fill="#f27fa9"/><circle cx="54" cy="77" r="1.8" fill="#fff"/>
      <rect x="26" y="58" width="11" height="11" rx="2" fill="#d6ecff" stroke="#e8a6c0" stroke-width="2"/><rect x="63" y="58" width="11" height="11" rx="2" fill="#d6ecff" stroke="#e8a6c0" stroke-width="2"/>
      <rect x="62" y="22" width="9" height="14" rx="2" fill="#fff" stroke="#e8a6c0" stroke-width="2"/>
    </symbol>
    <symbol id="tree" viewBox="0 0 100 100">
      <rect x="45" y="60" width="10" height="30" rx="3" fill="#d9a07c"/>
      <circle cx="50" cy="44" r="24" fill="#ffd6e5" stroke="#e8a6c0" stroke-width="2.5"/><circle cx="34" cy="54" r="15" fill="#ffe1ec" stroke="#e8a6c0" stroke-width="2.5"/><circle cx="66" cy="54" r="15" fill="#ffe1ec" stroke="#e8a6c0" stroke-width="2.5"/>
      <circle cx="44" cy="40" r="2.5" fill="#f27fa9"/><circle cx="58" cy="48" r="2.5" fill="#f27fa9"/><circle cx="38" cy="56" r="2.5" fill="#f27fa9"/>
    </symbol>
    <symbol id="cloud" viewBox="0 0 100 60">
      <path d="M22 50h56a14 14 0 0 0 0-28a20 20 0 0 0-38-6a16 16 0 0 0-18 34z" fill="#fff" stroke="#f7cfe0" stroke-width="2.5"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 100"><path d="M50 88 L14 50a20 20 0 0 1 36-24a20 20 0 0 1 36 24z" fill="#f9a8c9"/></symbol>
  </defs>
</svg>
<div class="wrap">
<header>
  <div class="brand">
    <svg class="mascot" aria-hidden="true"><use href="#bunny"/></svg>
    <h1>CCMM 점심 룰렛 <small>여의도공원 서측 · 국회의사당역까지 · KMAC 별점</small></h1>
  </div>
  <div class="nav"><a href="cafe/">☕ 디저트 룰렛</a><div class="stats" id="stats"></div></div>
</header>
<svg class="village" viewBox="0 0 1000 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <use href="#cloud" x="60" y="4" width="90" height="54"/><use href="#cloud" x="700" y="0" width="110" height="66"/><use href="#cloud" x="880" y="18" width="70" height="42"/>
  <ellipse cx="180" cy="150" rx="320" ry="70" fill="#ffe6ef"/><ellipse cx="820" cy="150" rx="340" ry="75" fill="#ffe1ec"/><ellipse cx="500" cy="165" rx="300" ry="70" fill="#fff0f5"/>
  <use href="#tree" x="20" y="40" width="70" height="70"/><use href="#house" x="110" y="30" width="80" height="80"/><use href="#tree" x="200" y="48" width="60" height="60"/>
  <use href="#bear" x="285" y="60" width="50" height="50"/><use href="#heart" x="333" y="52" width="16" height="16"/>
  <use href="#house" x="380" y="24" width="90" height="90"/><use href="#tree" x="470" y="44" width="66" height="66"/>
  <use href="#cat" x="560" y="62" width="48" height="48"/><use href="#bunny" x="615" y="58" width="52" height="52"/><use href="#heart" x="668" y="50" width="14" height="14"/>
  <use href="#tree" x="700" y="40" width="72" height="72"/><use href="#house" x="790" y="36" width="74" height="74"/><use href="#tree" x="880" y="50" width="58" height="58"/><use href="#tree" x="940" y="60" width="48" height="48"/>
</svg>

<div class="grid">
  <section class="card">
    <svg class="peek tr" aria-hidden="true"><use href="#bear"/></svg>
    <h2>룰렛 <span class="sub" id="poolCount"></span></h2>
    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="760" height="760" aria-label="점심 룰렛"></canvas>
      <div class="hub"><span>GO!</span></div>
    </div>
    <button class="spin" id="spin">🐰 룰렛 돌리기!</button>
    <div class="history" id="history"></div>
  </section>

  <section class="card">
    <svg class="peek tr" aria-hidden="true"><use href="#cat"/></svg>
    <h2>필터 <span class="sub">룰렛에 올릴 후보를 고릅니다</span></h2>

    <div class="fgroup">
      <div class="lbl"><span>음식 분류</span><span><button data-cat="all">전체</button><button data-cat="none">전체 해제</button></span></div>
      <div class="chips" id="catChips"></div>
    </div>

    <div class="fgroup">
      <div class="lbl"><span>구역</span><span><button data-zone="all">전체</button><button data-zone="scope">범위 안만</button><button data-zone="none">전체 해제</button></span></div>
      <div class="zones" id="zoneRow"></div>
    </div>

    <div class="fgroup">
      <div class="lbl"><span>KMAC 평가 조건</span></div>
      <div class="row" style="margin-top:0">
        <label>평균 별점
          <select id="minKmac">
            <option value="0">상관없음</option>
            <option value="3">3.0 이상</option>
            <option value="3.5">3.5 이상</option>
            <option value="4">4.0 이상</option>
            <option value="4.5">4.5 이상</option>
          </select>
        </label>
        <label><input type="checkbox" id="includeUnrated" checked> 아직 평가 없는 곳도 포함</label>
        <label><input type="checkbox" id="revisitOnly"> 재방문 의사 절반 이상만</label>
      </div>
    </div>

    <div class="fgroup">
      <div class="lbl"><span>기타</span></div>
      <div class="row" style="margin-top:0">
        <label><input type="checkbox" id="skipRecent" checked> 최근 5회 당첨 제외</label>
        <label><input type="checkbox" id="skipExcluded" checked> 목록에서 체크 해제한 곳 제외</label>
        <label><input type="checkbox" id="noFranchise"> 프랜차이즈 제외</label>
      </div>
    </div>

    <div class="summary"><span id="filterText"></span><span><span class="cnt" id="poolCnt">0</span>곳</span></div>
  </section>
</div>

<section class="card full">
  <h2>후보지 목록 <span class="sub" id="sync"></span></h2>
  <div class="toolbar">
    <input type="search" id="q" placeholder="상호·메뉴·건물 검색">
    <select id="sortBy">
      <option value="zone">구역순</option>
      <option value="kmac">KMAC 별점순</option>
      <option value="name">이름순</option>
      <option value="cat">분류순</option>
    </select>
    <button class="btn ghost" id="refreshBtn">시트 새로고침</button>
    <button class="btn ghost" id="exportBtn">평가 내보내기</button>
    <button class="btn ghost" id="importBtn">평가 가져오기</button>
    <input type="file" id="importFile" accept="application/json" class="sr">
    <button class="btn ghost danger" id="resetBtn">내 기록 초기화</button>
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr><th>포함</th><th>상호</th><th>분류·대표메뉴</th><th>위치</th><th>KMAC 별점</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<footer id="foot"></footer>
</div>

<!-- 결과 팝업 -->
<div class="modal" id="resultModal" role="dialog" aria-modal="true">
  <div class="dialog">
    <button class="x" data-close>×</button>
    <div class="result-body" id="resultBody"></div>
  </div>
</div>
<!-- 평가 팝업 -->
<div class="modal" id="rateModal" role="dialog" aria-modal="true">
  <div class="dialog">
    <button class="x" data-close>×</button>
    <h3 id="rateTitle">KMAC 별점</h3>
    <div class="field"><label>닉네임 (평가 구분용)</label><input type="text" id="who" maxlength="20" placeholder="예: 준원"></div>
    <div class="rate-row"><span class="k">맛</span><div class="stars" data-key="taste"></div><span class="v" data-v="taste">0</span></div>
    <div class="rate-row"><span class="k">청결</span><div class="stars" data-key="clean"></div><span class="v" data-v="clean">0</span></div>
    <div class="rate-row"><span class="k">친절도</span><div class="stars" data-key="kind"></div><span class="v" data-v="kind">0</span></div>
    <div class="rate-row"><span class="k">가격</span><div class="stars" data-key="price"></div><span class="v" data-v="price">0</span></div>
    <div class="field"><label>재방문 의사</label>
      <div class="seg" id="revisitSeg"><button data-rv="y">Y 또 올래요</button><button data-rv="n">N 한 번이면 충분</button></div>
    </div>
    <div class="field"><label>비고</label><textarea id="note" maxlength="300" placeholder="추천 메뉴, 웨이팅, 가격 등"></textarea></div>
    <div class="actions"><button class="btn primary" id="saveRate">저장</button><button class="btn ghost" data-close>취소</button></div>
    <div class="reviews" id="reviewList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="reviews.js"></script>
<script>window.APP={ key:'lunch', data:window.RESTAURANTS, meta:window.META, cheerers:['bunny','bear','cat'], lines:['오늘은 여기!','맛있게 먹고 와~','여기 어때?','고민 끝!','출발~'] };</script>
<script src="app.js"></script>
</body>
</html>
